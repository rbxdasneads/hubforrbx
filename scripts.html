<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>RBXHub | Free Roblox Scripts & Hubs</title>
    <meta name="description" content="Browse and copy the latest Roblox scripts, keyless hubs, and exploits auto-updated in real-time.">
    <link rel="canonical" href="https://rbxhub.org/scripts.html">

    <link rel="icon" type="image/png" href="/favicon-v2.png">
    <link rel="shortcut icon" href="/favicon.ico">

    <link rel="stylesheet" href="/output.css">
    
    <style>
        .glass { 
            background: #0f0f14 !important; 
            border: 1px solid rgba(255, 255, 255, 0.05) !important;
            border-radius: 16px;
            padding: 20px;
            transition: all 0.35s ease !important;
        }
        .glass:hover {
            background: #16161d !important; 
            border-color: rgba(59, 130, 246, 0.5) !important; 
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.15) !important; 
            transform: translateY(-4px);
        }

        /* Четкие стили для кнопки копирования */
        .btn-copy {
            background-color: #2563eb !important;
            color: #ffffff !important;
            font-weight: 700 !important;
            font-size: 0.75rem !important;
            text-transform: uppercase !important;
            letter-spacing: 0.05em !important;
            padding: 12px 16px !important;
            border-radius: 10px !important;
            border: none !important;
            cursor: pointer !important;
            width: 100% !important;
            transition: all 0.2s ease-in-out !important;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3) !important;
            display: block !important;
            text-align: center !important;
        }

        .btn-copy:hover {
            background-color: #3b82f6 !important;
            transform: translateY(-2px) !important;
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.5) !important;
        }

        .btn-copy:active {
            transform: translateY(0) !important;
        }

        /* Состояние кнопки при успешном копировании */
        .btn-copy.copied {
            background-color: #10b981 !important;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4) !important;
        }

        /* Кнопка "LOAD MORE" */
        .btn-load-more {
            background: #16161d;
            border: 1px solid rgba(59, 130, 246, 0.4);
            color: #fff;
            padding: 14px 32px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.875rem;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
        }
        .btn-load-more:hover {
            background: #2563eb;
            border-color: #3b82f6;
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.4);
            transform: translateY(-2px);
        }
    </style>
</head>

<body class="p-6 bg-[#050507] text-slate-300 font-[Consolas]">

<div class="max-w-6xl mx-auto">
    <!-- Шапка сайта -->
    <header class="grid grid-cols-3 items-center py-6 border-b border-gray-800 mb-12">
        <div class="flex items-center gap-6">
            <nav class="flex gap-3">
                <a href="/" class="px-5 py-2 rounded-lg border border-gray-700 bg-[#0f0f14] text-white font-bold transition-all hover:bg-[#16161d] hover:border-blue-500">Exploits</a>
                <a href="/scripts.html" class="px-5 py-2 rounded-lg border border-blue-500 bg-[#16161d] text-white font-bold">Scripts</a>
            </nav>
        </div>

        <div class="text-center">
            <h1 class="text-5xl font-black uppercase tracking-tighter italic">
                <span class="text-transparent bg-clip-text bg-gradient-to-r from-white to-gray-400">RBX</span><span class="text-blue-500">HUB</span>
            </h1>
        </div>

        <div class="flex justify-end">
            <div class="flex items-center gap-2 text-xs font-bold text-green-500 bg-green-500/5 px-3 py-1.5 rounded-full border border-green-500/20">
                <span class="h-2 w-2 rounded-full bg-green-500 animate-pulse"></span>AUTO UPDATING
            </div>
        </div>
    </header>

    <!-- Заголовок и поиск -->
    <div class="text-center mb-10 max-w-xl mx-auto">
        <h2 class="text-3xl font-black text-white uppercase tracking-tight">Latest Roblox Scripts</h2>
        <p class="text-sm text-gray-500 mt-2 mb-6">Auto-updated Roblox scripts & working hubs</p>

        <!-- Поисковая строка -->
        <div class="relative">
            <input type="text" id="search-input" placeholder="Search script or game..." 
                   class="w-full bg-[#0f0f14] border border-gray-800 rounded-xl px-5 py-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 transition-all shadow-inner">
        </div>
    </div>

    <!-- Контейнер для карточек -->
    <div id="scripts-container" class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-12">
        <div class="col-span-3 text-center py-12 text-gray-500">
            <p>Fetching latest scripts...</p>
        </div>
    </div>

    <!-- Кнопка "Загрузить ещё" -->
    <div class="text-center mb-20">
        <button id="load-more-btn" onclick="loadMoreScripts()" class="btn-load-more" style="display: none;">
            Load More Scripts
        </button>
    </div>

    <!-- Подвал сайта -->
    <footer class="mt-20 py-8 border-t border-gray-800 text-center">
        <div class="flex justify-center gap-6 text-sm text-gray-500 mb-2">
            <a href="legal.html" class="hover:text-white transition">Terms of Use</a>
            <a href="legal.html" class="hover:text-white transition">Privacy</a>
            <a href="legal.html" class="hover:text-white transition">Guidelines</a>
            <a href="legal.html" class="hover:text-white transition">Help</a>
        </div>
        <p class="text-xs text-gray-600">© 2026 RBXHub</p>
    </footer>
</div>

<script>
let currentPage = 1;
let currentQuery = '';
let searchTimeout = null;

// Обработка битых картинок
function handleImageError(img) {
    img.onerror = null;
    img.src = '/images/solara.webp';
}

// Загрузка скриптов
async function fetchScripts(query = '', page = 1, append = false) {
    const container = document.getElementById('scripts-container');
    const loadMoreBtn = document.getElementById('load-more-btn');

    if (!append) {
        container.innerHTML = '<p class="col-span-3 text-center py-12 text-gray-500">Loading scripts...</p>';
    }

    let url = `https://scriptblox.com/api/script/fetch?page=${page}`;
    if (query.trim() !== '') {
        url = `https://scriptblox.com/api/script/search?q=${encodeURIComponent(query)}&page=${page}`;
    }

    try {
        const response = await fetch(url);
        const data = await response.json();
        
        const scripts = data.result?.scripts || data.result?.matchedScripts || [];

        if (!append) {
            container.innerHTML = '';
        }

        if (scripts.length === 0) {
            if (!append) {
                container.innerHTML = '<p class="text-center text-gray-500 col-span-3 py-12">No scripts found.</p>';
            }
            loadMoreBtn.style.display = 'none';
            return;
        }

        scripts.forEach(item => {
            let imageUrl = '/images/solara.webp';
            if (item.game && item.game.imageUrl) {
                imageUrl = item.game.imageUrl.startsWith('http') 
                    ? item.game.imageUrl 
                    : 'https://scriptblox.com' + item.game.imageUrl;
            }

            const isKeyless = item.key === false;
            const keyBadge = isKeyless 
                ? `<span class="text-[10px] text-green-400 font-bold bg-green-500/10 px-2 py-0.5 rounded border border-green-500/20">KEYLESS</span>`
                : `<span class="text-[10px] text-yellow-400 font-bold bg-yellow-500/10 px-2 py-0.5 rounded border border-yellow-500/20">KEY SYSTEM</span>`;

            const gameName = item.game?.name || 'Roblox Game';
            const scriptTitle = item.title || 'Untitled Script';

            const card = document.createElement('div');
            card.className = 'glass flex flex-col justify-between h-full';
            card.innerHTML = `
                <div>
                    <div class="flex items-center gap-4 mb-4">
                        <img src="${imageUrl}" onerror="handleImageError(this)" class="h-14 w-14 rounded-xl object-cover bg-gray-900 border border-gray-800">
                        <div class="overflow-hidden">
                            <h3 class="text-base font-bold text-white truncate" title="${scriptTitle}">${scriptTitle}</h3>
                            <div class="flex items-center gap-2 mt-1">
                                <span class="text-[10px] text-blue-400 font-bold bg-blue-500/10 px-2 py-0.5 rounded border border-blue-500/20 truncate">${gameName}</span>
                                ${keyBadge}
                            </div>
                        </div>
                    </div>
                    <p class="text-xs text-gray-400 line-clamp-3 mb-6 leading-relaxed">
                        ${item.features || 'Universal script hub with auto-farm and player enhancements.'}
                    </p>
                </div>
                
                <button onclick="copyToClipboard(this, \`${encodeURIComponent(item.script || '')}\`)" 
                        class="btn-copy">
                    Copy Script
                </button>
            `;
            container.appendChild(card);
        });

        // Показываем кнопку "Load More", если подгрузилось 20 скриптов
        if (scripts.length >= 20) {
            loadMoreBtn.style.display = 'inline-block';
            loadMoreBtn.innerText = 'Load More Scripts';
        } else {
            loadMoreBtn.style.display = 'none';
        }

    } catch (error) {
        console.error('Error:', error);
        if (!append) {
            container.innerHTML = '<p class="text-center text-red-500 col-span-3 py-12">Failed to load scripts.</p>';
        }
    }
}

// Функция копирования с визуальной обратной связью на кнопке
function copyToClipboard(btnElement, encodedScript) {
    const scriptText = decodeURIComponent(encodedScript);
    navigator.clipboard.writeText(scriptText).then(() => {
        const originalText = btnElement.innerText;
        btnElement.innerText = '✓ COPIED!';
        btnElement.classList.add('copied');

        setTimeout(() => {
            btnElement.innerText = originalText;
            btnElement.classList.remove('copied');
        }, 2000);
    }).catch(err => {
        console.error('Copy failed:', err);
    });
}

// Загрузка следующей страницы
function loadMoreScripts() {
    const loadMoreBtn = document.getElementById('load-more-btn');
    loadMoreBtn.innerText = 'Loading...';
    currentPage++;
    fetchScripts(currentQuery, currentPage, true);
}

// Поиск
document.getElementById('search-input').addEventListener('input', (e) => {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => {
        currentQuery = e.target.value;
        currentPage = 1;
        fetchScripts(currentQuery, currentPage, false);
    }, 400);
});

// Запуск при старте
fetchScripts();
</script>

</body>
</html>
