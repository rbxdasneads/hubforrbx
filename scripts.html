<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RBXHub | Latest Roblox Scripts</title>
    <link rel="stylesheet" href="/output.css">
    <style>
        .glass { 
            background: #0f0f14 !important; 
            border: 1px solid rgba(255, 255, 255, 0.05) !important;
            border-radius: 16px;
            padding: 20px;
            transition: all 0.35s ease !important;
        }
        .glass:hover {
            background: #16161d !important; 
            border-color: rgba(59, 130, 246, 0.5) !important; 
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.15) !important; 
            transform: translateY(-4px);
        }
    </style>
</head>
<body class="p-6 bg-[#050507] text-slate-300 font-[Consolas]">

<div class="max-w-6xl mx-auto">
    <!-- Шапка -->
    <header class="grid grid-cols-3 items-center py-6 border-b border-gray-800 mb-12">
        <div class="flex items-center gap-6">
            <nav class="flex gap-3">
                <a href="/" class="px-5 py-2 rounded-lg border border-gray-700 bg-[#0f0f14] text-white font-bold transition-all hover:bg-[#16161d] hover:border-blue-500">Exploits</a>
                <a href="/scripts.html" class="px-5 py-2 rounded-lg border border-blue-500 bg-[#16161d] text-white font-bold">Scripts</a>
            </nav>
        </div>
        <div class="text-center">
            <h1 class="text-5xl font-black uppercase tracking-tighter italic">
                <span class="text-transparent bg-clip-text bg-gradient-to-r from-white to-gray-400">RBX</span><span class="text-blue-500">HUB</span>
            </h1>
        </div>
        <div></div>
    </header>

    <div class="text-center mb-10">
        <h2 class="text-3xl font-black text-white uppercase tracking-tight">Latest Scripts</h2>
        <p class="text-sm text-gray-500 mt-2">Auto-updated Roblox scripts & hubs</p>
    </div>

    <!-- Контейнер, куда скрипт будет подгружать карточки -->
    <div id="scripts-container" class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-20">
        <p class="text-center text-gray-500 col-span-3">Loading latest scripts...</p>
    </div>
</div>

<script>
// Функция автозагрузки скриптов
async function loadScripts() {
    const container = document.getElementById('scripts-container');
    try {
        // Запрашиваем свежие скрипты с API ScriptBlox
        const response = await fetch('https://scriptblox.com/api/script/fetch?page=1');
        const data = await response.json();
        
        container.innerHTML = ''; // Очищаем текст загрузки

        data.result.scripts.forEach(script => {
            // Формируем ссылку на картинку игры
            const imageUrl = script.game.imageUrl 
                ? (script.game.imageUrl.startsWith('http') ? script.game.imageUrl : 'https://scriptblox.com' + script.game.imageUrl)
                : '/images/solara.webp';

            const card = document.createElement('div');
            card.className = 'glass p-6 flex flex-col justify-between';
            card.innerHTML = `
                <div>
                    <div class="flex items-center gap-4 mb-4">
                        <img src="${imageUrl}" class="h-14 w-14 rounded-xl object-cover" onerror="this.src='/images/solara.webp'">
                        <div>
                            <h3 class="text-lg font-bold text-white line-clamp-1">${script.title}</h3>
                            <span class="text-[10px] text-blue-400 font-bold bg-blue-500/10 px-2 py-0.5 rounded border border-blue-500/20">${script.game.name}</span>
                        </div>
                    </div>
                    <p class="text-xs text-gray-400 line-clamp-3 mb-4">${script.features || 'No description provided.'}</p>
                </div>
                <button onclick="navigator.clipboard.writeText(\`${script.script.replace(/`/g, '\\`')}\`); alert('Script copied to clipboard!');" 
                        class="w-full py-2 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-lg text-sm transition">
                    Copy Script
                </button>
            `;
            container.appendChild(card);
        });
    } catch (error) {
        console.error('Error fetching scripts:', error);
        container.innerHTML = '<p class="text-center text-red-500 col-span-3">Failed to load scripts. Please try again later.</p>';
    }
}

// Запускаем при загрузке страницы
loadScripts();
</script>

</body>
</html>
