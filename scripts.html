             onclick="copyCode()" id="modal-code"></div>

          { title: "Kick a Lucky Block", desc: "Auto Kick, Auto Train, TP, Inf Speed & More", url: "https://api.jnkie.com/api/v1/luascripts/public/4ad6a2d2335968486879c1b1a2dcefc6937ea63c8acb88e703a1ec95a4a146ea/download" },
           { title: "Murderers VS Sheriffs", desc: "1v1 Auto Kill, Hitbox Expander, Tracers & More", url: "https://api.jnkie.com/api/v1/luascripts/public/4ad6a2d2335968486879c1b1a2dcefc6937ea63c8acb88e703a1ec95a4a146ea/download" },

        { title: "Blade Ball", desc: "Blade Ball Auto Parry", url: "https://raw.githubusercontent.com/Scriptsnets/BladeBall/refs/heads/main/Argon-Hub-X-BladeBall-OP.lua" },

        { title: "Grow a Garden 2", desc: "Lumin Hub | FREE FINDER (LEGENDARY,MYTHICAL & SUPER)", url: "https://api.luarmor.net/files/v4/loaders/795c7accd08487171484e54a92e75c77.lua" },
        { title: "Atherhub (25games)", desc: "Script VerifiedAtherhub | 25+ Games | Overpowered, Undetected, FREE", url: "https://api.luarmor.net/files/v3/loaders/2529a5f9dfddd5523ca4e22f21cceffa.lua" },

        { title: "Be a Lucky Block", desc: "Be a Lucky Block: Auto Farm, Auto Rebirth, Auto Upgrade", url: "https://pastebin.com/raw/PXGf6qSS" }
    ];

   let currentIndex = 0;
    const container = document.getElementById('script-container');
    const btn = document.getElementById('load-more');
    const searchInput = document.getElementById('scriptSearch');

    function render(filter = "", isLoadMore = false) {
        if (!filter) {
            const toShow = scripts.slice(0, currentIndex + 6);
            container.innerHTML = "";
            toShow.forEach(s => createCard(s));
            btn.style.display = (currentIndex + 6 >= scripts.length) ? 'none' : 'block';
        } else {
            container.innerHTML = "";
            const filtered = scripts.filter(s => s.title.toLowerCase().includes(filter.toLowerCase()));
            filtered.forEach(s => createCard(s));
            btn.style.display = 'none';
        }
    }

    function createCard(s) {
        const div = document.createElement('div');
        div.className = "glass p-6 cursor-pointer";
        div.onclick = () => openModal(s);
        div.innerHTML = `<h2 class="text-lg font-black text-white uppercase">${s.title}</h2><p class="text-sm text-gray-500 mt-2">${s.desc}</p>`;
        container.appendChild(div);
    }

    btn.onclick = () => {
        const originalText = btn.innerText;
        btn.innerText = "LOADING...";
        btn.disabled = true;
        setTimeout(() => {
            currentIndex += 6;
            render("", true);
            btn.innerText = originalText;
            btn.disabled = false;
        }, 800);
    };

    searchInput.addEventListener('input', (e) => render(e.target.value));

    function openModal(s) {
        document.getElementById('modal').classList.remove('hidden');
        document.getElementById('modal-title').innerText = s.title;
        document.getElementById('modal-desc').innerText = s.desc;
        document.getElementById('modal-code').innerText = `loadstring(game:HttpGet("${s.url}", true))()`;
    }

    function closeModal() { document.getElementById('modal').classList.add('hidden'); }

    function copyCode() {
        const code = document.getElementById('modal-code').innerText;
        navigator.clipboard.writeText(code);
        alert("Код скопирован!");
    }

    render();
</script>
</body>
</html>
