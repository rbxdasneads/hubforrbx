<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>RBXHub | Free Roblox Scripts & Hubs</title>
    <meta name="description" content="Browse and copy the latest Roblox scripts, keyless hubs, and exploits auto-updated in real-time.">
    <link rel="canonical" href="https://rbxhub.org/scripts.html">

    <link rel="icon" type="image/png" href="/favicon-v2.png">
    <link rel="shortcut icon" href="/favicon.ico">

    <link rel="stylesheet" href="/output.css">
    
    <style>
        /* Карточки скриптов */
        .glass-card { 
            background: #0d0e12 !important; 
            border: 1px solid rgba(255, 255, 255, 0.07) !important;
            border-radius: 16px;
            padding: 20px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1) !important;
            position: relative;
            overflow: hidden !important;
        }
        .glass-card:hover {
            background: #11131a !important; 
            border-color: rgba(59, 130, 246, 0.35) !important; 
            box-shadow: 0 10px 30px -10px rgba(59, 130, 246, 0.15) !important; 
            transform: translateY(-3px);
        }

        /* Поле ввода поиска */
        .search-input {
            background: #0d0e12;
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #ffffff;
            transition: all 0.2s ease;
        }
        .search-input:focus {
            border-color: rgba(59, 130, 246, 0.6);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.12);
            outline: none;
        }

        /* Кнопка Copy Script */
        .btn-copy {
            background: rgba(255, 255, 255, 0.03) !important;
            color: #a1a1aa !important;
            font-weight: 700 !important;
            font-size: 0.75rem !important;
            text-transform: uppercase !important;
            letter-spacing: 0.05em !important;
            padding: 10px 14px !important;
            border-radius: 10px !important;
            border: 1px solid rgba(255, 255, 255, 0.08) !important;
            cursor: pointer !important;
            width: 100% !important;
            transition: all 0.2s ease !important;
            display: block !important;
            text-align: center !important;
        }

        .btn-copy:hover {
            background: rgba(59, 130, 246, 0.12) !important;
            color: #60a5fa !important;
            border-color: rgba(59, 130, 246, 0.4) !important;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.15) !important;
        }

        .btn-copy.copied {
            background: rgba(16, 185, 129, 0.15) !important;
            color: #34d399 !important;
            border-color: rgba(16, 185, 129, 0.4) !important;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.2) !important;
        }

        /* Кнопка Load More */
        .btn-load-more {
            background: #0d0e12;
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #fff;
            padding: 12px 32px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .btn-load-more:hover {
            background: #2563eb;
            border-color: #3b82f6;
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.35);
            transform: translateY(-2px);
        }
    </style>
</head>

<body class="p-6 bg-[#050507] text-slate-300 font-[Consolas]">

<div class="max-w-6xl mx-auto">
    <!-- Шапка сайта -->
    <header class="grid grid-cols-3 items-center py-6 border-b border-gray-800/80 mb-12">
        <div class="flex items-center gap-6">
            <nav class="flex gap-3">
                <a href="/" class="px-5 py-2 rounded-xl border border-gray-800 bg-[#0d0e12] text-gray-300 font-bold text-sm transition-all hover:bg-[#12141c] hover:text-white hover:border-gray-700">Exploits</a>
                <a href="/scripts.html" class="px-5 py-2 rounded-xl border border-blue-500/50 bg-blue-500/10 text-white font-bold text-sm shadow-[0_0_15px_rgba(59,130,246,0.15)]">Scripts</a>
            </nav>
        </div>

        <div class="text-center">
            <h1 class="text-5xl font-black uppercase tracking-tighter italic">
                <span class="text-transparent bg-clip-text bg-gradient-to-r from-white to-gray-400">RBX</span><span class="text-blue-500">HUB</span>
            </h1>
        </div>

        <div class="flex justify-end">
            <div class="flex items-center gap-2 text-xs font-bold text-green-400 bg-green-500/10 px-3.5 py-1.5 rounded-full border border-green-500/20 shadow-sm">
                <span class="h-2 w-2 rounded-full bg-green-400 animate-pulse"></span>AUTO UPDATING
            </div>
        </div>
    </header>

    <!-- Заголовок страницы -->
    <div class="text-center mb-8">
        <h2 class="text-3xl font-black text-white uppercase tracking-tight">Latest Roblox Scripts</h2>
        <p class="text-sm text-gray-500 mt-1">Auto-updated Roblox scripts & working hubs</p>
    </div>

    <!-- Панель Поиска и Кастомной Сортировки -->
    <div class="flex flex-col sm:flex-row gap-3 max-w-3xl mx-auto mb-10">
        <!-- Поле Поиска -->
        <div class="relative flex-1">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                <svg style="width:16px; height:16px;" class="text-gray-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            </div>
            <input type="text" id="search-input" placeholder="Search script or game name..." 
                   class="w-full search-input rounded-xl pl-10 pr-4 py-3 text-sm placeholder-gray-500">
        </div>

        <!-- Кастомное Выпадающее Меню Сортировки -->
        <div class="relative w-full sm:w-56" id="custom-sort-dropdown">
            <button type="button" id="sort-dropdown-btn" onclick="toggleSortDropdown()" 
                    class="w-full flex items-center justify-between px-4 py-3 text-sm font-bold text-gray-200 bg-[#0d0e12] border border-white/10 rounded-xl hover:border-blue-500/40 hover:text-white transition-all duration-200 shadow-lg">
                <span id="sort-selected-text" class="truncate flex items-center gap-2">
                    <svg style="width:14px; height:14px;" class="text-blue-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4h13M3 8h9m-9 4h6m4 0l4-4m0 0l4 4m-4-4v12"/></svg>
                    Sort: Latest
                </span>
                <svg id="sort-arrow" style="width:14px; height:14px; transition: transform 0.2s ease;" class="text-gray-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
            </button>
            
            <!-- Выпадающее меню -->
            <div id="sort-dropdown-menu" 
                 class="hidden absolute right-0 left-0 mt-2 py-1.5 bg-[#0e1017] border border-blue-500/30 rounded-xl shadow-[0_10px_30px_rgba(0,0,0,0.8)] backdrop-blur-xl z-50 transition-all duration-200 opacity-0 scale-95 transform origin-top">
                <div onclick="selectSort('latest', 'Latest')" class="sort-option bg-blue-500/10 text-white px-4 py-2.5 text-xs font-bold hover:bg-blue-600/20 cursor-pointer transition flex items-center justify-between">
                    <span>Sort: Latest</span>
                    <span class="check-mark text-blue-400 font-bold">✓</span>
                </div>
                <div onclick="selectSort('views-desc', 'Most Viewed')" class="sort-option text-gray-300 px-4 py-2.5 text-xs font-bold hover:text-white hover:bg-blue-600/20 cursor-pointer transition flex items-center justify-between">
                    <span>Sort: Most Viewed</span>
                    <span class="check-mark hidden text-blue-400 font-bold">✓</span>
                </div>
                <div onclick="selectSort('views-asc', 'Least Viewed')" class="sort-option text-gray-300 px-4 py-2.5 text-xs font-bold hover:text-white hover:bg-blue-600/20 cursor-pointer transition flex items-center justify-between">
                    <span>Sort: Least Viewed</span>
                    <span class="check-mark hidden text-blue-400 font-bold">✓</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Контейнер для карточек -->
    <div id="scripts-container" class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">
        <div class="col-span-3 text-center py-16 text-gray-500">
            <p class="animate-pulse">Fetching latest scripts from database...</p>
        </div>
    </div>

    <!-- Кнопка "Загрузить ещё" -->
    <div class="text-center mb-20">
        <button id="load-more-btn" onclick="loadMoreScripts()" class="btn-load-more" style="display: none;">
            Load More Scripts
        </button>
    </div>

    <!-- Подвал сайта -->
    <footer class="mt-20 py-8 border-t border-gray-800/80 text-center">
        <div class="flex justify-center gap-6 text-sm text-gray-500 mb-3">
            <a href="legal.html" class="hover:text-white transition">Terms of Use</a>
            <a href="legal.html" class="hover:text-white transition">Privacy</a>
            <a href="legal.html" class="hover:text-white transition">Guidelines</a>
            <a href="legal.html" class="hover:text-white transition">Help</a>
        </div>
        <p class="text-xs text-gray-600">© 2026 RBXHub</p>
    </footer>
</div>

<script>
let currentPage = 1;
let currentQuery = '';
let currentSort = 'latest';
let allFetchedScripts = [];
let searchTimeout = null;

// Заглушка для битых картинок
function handleImageError(img) {
    img.onerror = null;
    img.src = '/images/solara.webp';
}

// Форматирование просмотров
function formatViews(views) {
    const num = Number(views) || 0;
    if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
    if (num >= 1000) return (num / 1000).toFixed(1) + 'k';
    return num.toString();
}

// Переключение выпадения кастомного меню
function toggleSortDropdown() {
    const menu = document.getElementById('sort-dropdown-menu');
    const arrow = document.getElementById('sort-arrow');
    const isHidden = menu.classList.contains('hidden');
    
    if (isHidden) {
        menu.classList.remove('hidden');
        setTimeout(() => {
            menu.classList.remove('opacity-0', 'scale-95');
            menu.classList.add('opacity-100', 'scale-100');
        }, 10);
        if (arrow) arrow.style.transform = 'rotate(180deg)';
    } else {
        closeSortDropdown();
    }
}

function closeSortDropdown() {
    const menu = document.getElementById('sort-dropdown-menu');
    const arrow = document.getElementById('sort-arrow');
    if (!menu) return;
    menu.classList.remove('opacity-100', 'scale-100');
    menu.classList.add('opacity-0', 'scale-95');
    if (arrow) arrow.style.transform = 'rotate(0deg)';
    setTimeout(() => {
        menu.classList.add('hidden');
    }, 200);
}

function selectSort(val, label) {
    currentSort = val;
    
    // Обновляем текст кнопки
    document.getElementById('sort-selected-text').innerHTML = `
        <svg style="width:14px; height:14px;" class="text-blue-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4h13M3 8h9m-9 4h6m4 0l4-4m0 0l4 4m-4-4v12"/></svg>
        Sort: ${label}
    `;
    
    // Подсветка активной опции
    const options = document.querySelectorAll('.sort-option');
    options.forEach(opt => {
        const isMatch = opt.getAttribute('onclick').includes(`'${val}'`);
        const check = opt.querySelector('.check-mark');
        if (isMatch) {
            opt.classList.add('bg-blue-500/10', 'text-white');
            opt.classList.remove('text-gray-300');
            if (check) check.classList.remove('hidden');
        } else {
            opt.classList.remove('bg-blue-500/10', 'text-white');
            opt.classList.add('text-gray-300');
            if (check) check.classList.add('hidden');
        }
    });

    closeSortDropdown();
    renderScripts();
}

// Закрытие меню при клике вне его
document.addEventListener('click', (e) => {
    const dropdown = document.getElementById('custom-sort-dropdown');
    if (dropdown && !dropdown.contains(e.target)) {
        closeSortDropdown();
    }
});

// Уникальное динамическое описание для каждого скрипта
function getScriptDescription(item) {
    if (item.features && typeof item.features === 'string' && item.features.trim().length > 3) {
        return item.features.trim();
    }
    if (Array.isArray(item.features) && item.features.length > 0) {
        return item.features.join(', ');
    }
    if (item.description && typeof item.description === 'string' && item.description.trim().length > 3) {
        return item.description.trim();
    }

    const rawTitle = item.title || 'Roblox Script';
    const gameName = item.game?.name || 'Roblox';
    const cleanTitle = rawTitle.replace(/\[.*?\]/g, '').replace(/\|/g, '').trim();

    if (item.key === false) {
        return `Free keyless script for ${gameName}. Features ${cleanTitle || 'custom GUI'} with fast execution and instant access.`;
    }
    
    return `${cleanTitle || 'Script Hub'} designed for ${gameName}. Updated script features and player enhancements for execution.`;
}

// Отрисовка карточек
function renderScripts() {
    const container = document.getElementById('scripts-container');
    container.innerHTML = '';

    if (allFetchedScripts.length === 0) {
        container.innerHTML = '<p class="text-center text-gray-500 col-span-3 py-16">No scripts found.</p>';
        return;
    }

    let displayScripts = [...allFetchedScripts];

    if (currentSort === 'views-desc') {
        displayScripts.sort((a, b) => (Number(b.views) || 0) - (Number(a.views) || 0));
    } else if (currentSort === 'views-asc') {
        displayScripts.sort((a, b) => (Number(a.views) || 0) - (Number(b.views) || 0));
    }

    displayScripts.forEach(item => {
        let imageUrl = '/images/solara.webp';
        if (item.game && item.game.imageUrl) {
            imageUrl = item.game.imageUrl.startsWith('http') 
                ? item.game.imageUrl 
                : 'https://scriptblox.com' + item.game.imageUrl;
        }

        const isKeyless = item.key === false;
        const keyBadge = isKeyless 
            ? `<span class="text-[10px] text-green-400 font-bold bg-green-500/10 px-2 py-0.5 rounded-md border border-green-500/20 shrink-0">KEYLESS</span>`
            : `<span class="text-[10px] text-yellow-400 font-bold bg-yellow-500/10 px-2 py-0.5 rounded-md border border-yellow-500/20 shrink-0">KEY SYSTEM</span>`;

        const verifiedBadge = item.verified 
            ? `<span class="text-[10px] text-blue-400 font-bold bg-blue-500/10 px-2 py-0.5 rounded-md border border-blue-500/20 shrink-0">VERIFIED</span>` 
            : '';

        const gameName = item.game?.name || 'Roblox Game';
        const scriptTitle = item.title || 'Untitled Script';
        const viewsCount = formatViews(item.views);
        const scriptDesc = getScriptDescription(item);

        const card = document.createElement('div');
        card.className = 'glass-card flex flex-col justify-between h-full overflow-hidden w-full';
        card.innerHTML = `
            <div class="min-w-0">
                <div class="flex items-start gap-3 mb-3.5 min-w-0">
                    <img src="${imageUrl}" onerror="handleImageError(this)" class="h-12 w-12 rounded-xl object-cover bg-gray-900 border border-gray-800 shrink-0">
                    <div class="min-w-0 flex-1">
                        <h3 class="text-sm font-bold text-white truncate w-full" title="${scriptTitle}">${scriptTitle}</h3>
                        <div class="flex flex-wrap items-center gap-1.5 mt-1.5">
                            <span class="text-[10px] text-gray-400 font-semibold bg-gray-800/60 px-2 py-0.5 rounded-md border border-gray-700/50 truncate max-w-[110px]">${gameName}</span>
                            ${keyBadge}
                            ${verifiedBadge}
                        </div>
                    </div>
                </div>
                <p class="text-xs text-gray-400/90 line-clamp-3 mb-5 leading-relaxed break-words">
                    ${scriptDesc}
                </p>
            </div>
            
            <div class="mt-auto">
                <div class="flex justify-between items-center text-[11px] text-gray-500 mb-2.5 px-1">
                    <span class="flex items-center gap-1.5"><span class="text-gray-400">👁</span> ${viewsCount} views</span>
                    <span class="text-blue-400/90 font-bold tracking-wider text-[10px] uppercase">RBXHub</span>
                </div>
                <button onclick="copyToClipboard(this, \`${encodeURIComponent(item.script || '')}\`)" 
                        class="btn-copy">
                    Copy Script
                </button>
            </div>
        `;
        container.appendChild(card);
    });
}

// Загрузка данных с API
async function fetchScripts(query = '', page = 1, append = false) {
    const container = document.getElementById('scripts-container');
    const loadMoreBtn = document.getElementById('load-more-btn');

    if (!append) {
        allFetchedScripts = [];
        container.innerHTML = '<p class="col-span-3 text-center py-16 text-gray-500 animate-pulse">Loading scripts...</p>';
    }

    let url = `https://scriptblox.com/api/script/fetch?page=${page}`;
    if (query.trim() !== '') {
        url = `https://scriptblox.com/api/script/search?q=${encodeURIComponent(query)}&page=${page}`;
    }

    try {
        const response = await fetch(url);
        const data = await response.json();
        
        const scripts = data.result?.scripts || data.result?.matchedScripts || [];

        if (append) {
            allFetchedScripts = [...allFetchedScripts, ...scripts];
        } else {
            allFetchedScripts = scripts;
        }

        renderScripts();

        if (scripts.length >= 20) {
            loadMoreBtn.style.display = 'inline-block';
            loadMoreBtn.innerText = 'Load More Scripts';
        } else {
            loadMoreBtn.style.display = 'none';
        }

    } catch (error) {
        console.error('Error:', error);
        if (!append) {
            container.innerHTML = '<p class="text-center text-red-500 col-span-3 py-16">Failed to load scripts.</p>';
        }
    }
}

// Копирование в буфер
function copyToClipboard(btnElement, encodedScript) {
    const scriptText = decodeURIComponent(encodedScript);
    navigator.clipboard.writeText(scriptText).then(() => {
        const originalText = btnElement.innerText;
        btnElement.innerText = '✓ COPIED TO CLIPBOARD';
        btnElement.classList.add('copied');

        setTimeout(() => {
            btnElement.innerText = originalText;
            btnElement.classList.remove('copied');
        }, 2000);
    }).catch(err => {
        console.error('Copy failed:', err);
    });
}

// Загрузить еще
function loadMoreScripts() {
    const loadMoreBtn = document.getElementById('load-more-btn');
    loadMoreBtn.innerText = 'Loading...';
    currentPage++;
    fetchScripts(currentQuery, currentPage, true);
}

// Поиск
document.getElementById('search-input').addEventListener('input', (e) => {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => {
        currentQuery = e.target.value;
        currentPage = 1;
        fetchScripts(currentQuery, currentPage, false);
    }, 400);
});

// Инициализация
fetchScripts();
</script>

</body>
</html>
