<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>RBXHub | Free Roblox Scripts & Hubs</title>
    <meta name="description" content="Browse and copy the latest Roblox scripts, keyless hubs, and exploits auto-updated in real-time.">
    <link rel="canonical" href="https://rbxhub.org/scripts.html">

    <link rel="icon" type="image/png" href="/favicon-v2.png">
    <link rel="shortcut icon" href="/favicon.ico">

    <link rel="stylesheet" href="/output.css">
    
    <style>
        /* Сброс стандартных фокусов */
        *:focus {
            outline: none !important;
        }

        /* Карточки скриптов */
        .glass-card { 
            background: #0b0d14 !important; 
            border: 1px solid #161922 !important;
            border-radius: 16px !important;
            padding: 18px !important;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1) !important;
            position: relative !important;
            overflow: hidden !important;
            width: 100% !important;
            box-sizing: border-box !important;
        }
        .glass-card:hover {
            background: #0f121d !important; 
            border-color: rgba(59, 130, 246, 0.35) !important; 
            box-shadow: 0 10px 30px -10px rgba(59, 130, 246, 0.15) !important; 
            transform: translateY(-2px);
        }

        /* Превью картинки внутри карточки */
        .card-thumb-wrapper {
            width: 50px !important;
            height: 50px !important;
            min-width: 50px !important;
            max-width: 50px !important;
            min-height: 50px !important;
            max-height: 50px !important;
            flex-shrink: 0 !important;
            border-radius: 12px !important;
            overflow: hidden !important;
            background: #121520 !important;
            border: 1px solid #1e2230 !important;
        }
        .card-thumb-wrapper img {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            display: block !important;
        }

        /* Поле поиска */
        .search-input {
            background: #0b0d14 !important;
            border: 1px solid #161922 !important;
            color: #ffffff !important;
            transition: all 0.2s ease !important;
        }
        .search-input:focus {
            border-color: rgba(59, 130, 246, 0.5) !important;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.1) !important;
        }

        /* Кнопка сортировки */
        .sort-btn {
            background: #0b0d14 !important;
            border: 1px solid #161922 !important;
            color: #d1d5db !important;
            transition: all 0.2s ease !important;
            height: 100% !important;
        }
        .sort-btn:hover {
            border-color: rgba(59, 130, 246, 0.3) !important;
            color: #ffffff !important;
            background: #0e111a !important;
        }

        /* Анимированное выпадающее меню сортировки */
        .sort-menu-dropdown {
            position: absolute;
            right: 0;
            left: 0;
            margin-top: 8px;
            padding: 6px;
            background: #0c0e15 !important;
            border: 1px solid #1d2130 !important;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8), 0 0 15px rgba(59, 130, 246, 0.08) !important;
            z-index: 50;
            
            /* Плавная анимация появления */
            opacity: 0;
            transform: translateY(-8px) scale(0.96);
            pointer-events: none;
            transition: opacity 0.22s cubic-bezier(0.16, 1, 0.3, 1), transform 0.22s cubic-bezier(0.16, 1, 0.3, 1) !important;
            backdrop-filter: blur(12px);
        }

        .sort-menu-dropdown.is-open {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .sort-option {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            font-size: 0.75rem;
            font-weight: 700;
            color: #9ca3af;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.18s ease;
        }

        .sort-option:hover {
            background: rgba(59, 130, 246, 0.12);
            color: #ffffff;
            transform: translateX(2px);
        }

        .sort-option.active-option {
            background: rgba(59, 130, 246, 0.18);
            color: #ffffff;
        }

        /* Кнопка Copy Script */
        .btn-copy {
            background: rgba(255, 255, 255, 0.03) !important;
            color: #a1a1aa !important;
            font-weight: 700 !important;
            font-size: 0.75rem !important;
            text-transform: uppercase !important;
            letter-spacing: 0.05em !important;
            padding: 10px 14px !important;
            border-radius: 10px !important;
            border: 1px solid #1a1d28 !important;
            cursor: pointer !important;
            width: 100% !important;
            transition: all 0.2s ease !important;
            display: block !important;
            text-align: center !important;
        }

        .btn-copy:hover {
            background: rgba(59, 130, 246, 0.12) !important;
            color: #60a5fa !important;
            border-color: rgba(59, 130, 246, 0.4) !important;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.15) !important;
        }

        .btn-copy.copied {
            background: rgba(16, 185, 129, 0.15) !important;
            color: #34d399 !important;
            border-color: rgba(16, 185, 129, 0.4) !important;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.2) !important;
        }

        /* Кнопка Load More */
        .btn-load-more {
            background: #0b0d14;
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #fff;
            padding: 12px 32px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .btn-load-more:hover {
            background: #2563eb;
            border-color: #3b82f6;
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.35);
            transform: translateY(-2px);
        }
    </style>
</head>

<body class="p-6 bg-[#050507] text-slate-300 font-[Consolas]">

<div class="max-w-6xl mx-auto">
    <!-- Шапка сайта -->
    <header class="grid grid-cols-3 items-center py-6 border-b border-gray-800/60 mb-12">
        <!-- Навигация -->
        <div class="flex items-center gap-3">
            <a href="/" class="px-5 py-2 rounded-xl border border-gray-800 bg-[#0b0d14] text-gray-300 font-bold text-sm transition-all hover:bg-[#12141c] hover:text-white hover:border-gray-700">Exploits</a>
            <a href="/scripts.html" class="px-5 py-2 rounded-xl border border-blue-500/50 bg-blue-500/10 text-white font-bold text-sm shadow-[0_0_15px_rgba(59,130,246,0.15)]">Scripts</a>
        </div>

        <!-- Логотип -->
        <div class="text-center">
            <h1 class="text-5xl font-black uppercase tracking-tighter italic">
                <span class="text-transparent bg-clip-text bg-gradient-to-r from-white to-gray-400">RBX</span><span class="text-blue-500">HUB</span>
            </h1>
        </div>

        <!-- Ровная ровная плашка Auto Updating -->
        <div class="flex justify-end items-center">
            <div class="inline-flex items-center gap-2.5 px-4 py-2 rounded-xl bg-emerald-950/40 border border-emerald-500/30 text-emerald-400 font-extrabold text-xs tracking-wider uppercase shadow-[0_0_12px_rgba(16,185,129,0.1)]">
                <span class="relative flex h-2 w-2">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-400"></span>
                </span>
                <span>Auto Updating</span>
            </div>
        </div>
    </header>

    <!-- Заголовок страницы -->
    <div class="text-center mb-8">
        <h2 class="text-3xl font-black text-white uppercase tracking-tight">Latest Roblox Scripts</h2>
        <p class="text-sm text-gray-500 mt-1">Auto-updated Roblox scripts & working hubs</p>
    </div>

    <!-- Панель Поиска и Сортировки -->
    <div class="flex flex-col sm:flex-row gap-3 max-w-3xl mx-auto mb-10">
        <!-- Поле Поиска (с идеально отцентрованной лупой) -->
        <div class="relative flex-1" style="position: relative;">
            <div style="position: absolute; top: 50%; transform: translateY(-50%); left: 14px; pointer-events: none; z-index: 10; display: flex; align-items: center;">
                <svg style="width:16px; height:16px;" class="text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                </svg>
            </div>
            <input type="text" id="search-input" placeholder="Search script or game name..." 
                   class="w-full search-input rounded-xl pl-10 pr-4 py-3 text-sm placeholder-gray-500">
        </div>

        <!-- Кастомное Анимированное Выпадающее Меню -->
        <div class="relative w-full sm:w-52" id="custom-sort-dropdown">
            <button type="button" id="sort-dropdown-btn" onclick="toggleSortDropdown()" 
                    class="w-full sort-btn flex items-center justify-between px-4 py-3 text-xs font-bold rounded-xl cursor-pointer">
                <span id="sort-selected-text" class="truncate flex items-center gap-2">
                    <svg style="width:14px; height:14px;" class="text-blue-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4h13M3 8h9m-9 4h6m4 0l4-4m0 0l4 4m-4-4v12"/>
                    </svg>
                    <span id="current-sort-label">Latest</span>
                </span>
                <svg id="sort-arrow" style="width:13px; height:13px; transition: transform 0.25s ease;" class="text-gray-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                </svg>
            </button>
            
            <!-- Меню выбора -->
            <div id="sort-dropdown-menu" class="sort-menu-dropdown">
                <div onclick="selectSort('latest', 'Latest')" class="sort-option active-option">
                    <span>Latest</span>
                    <span class="check-mark text-blue-400 font-bold">✓</span>
                </div>
                <div onclick="selectSort('views-desc', 'Most Viewed')" class="sort-option">
                    <span>Most Viewed</span>
                    <span class="check-mark hidden text-blue-400 font-bold">✓</span>
                </div>
                <div onclick="selectSort('views-asc', 'Least Viewed')" class="sort-option">
                    <span>Least Viewed</span>
                    <span class="check-mark hidden text-blue-400 font-bold">✓</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Контейнер карточек -->
    <div id="scripts-container" class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">
        <div class="col-span-3 text-center py-16 text-gray-500">
            <p class="animate-pulse">Fetching latest scripts from database...</p>
        </div>
    </div>

    <!-- Кнопка "Загрузить ещё" -->
    <div class="text-center mb-20">
        <button id="load-more-btn" onclick="loadMoreScripts()" class="btn-load-more" style="display: none;">
            Load More Scripts
        </button>
    </div>

    <!-- Подвал сайта -->
    <footer class="mt-20 py-8 border-t border-gray-800/60 text-center">
        <div class="flex justify-center gap-6 text-sm text-gray-500 mb-3">
            <a href="legal.html" class="hover:text-white transition">Terms of Use</a>
            <a href="legal.html" class="hover:text-white transition">Privacy</a>
            <a href="legal.html" class="hover:text-white transition">Guidelines</a>
            <a href="legal.html" class="hover:text-white transition">Help</a>
        </div>
        <p class="text-xs text-gray-600">© 2026 RBXHub</p>
    </footer>
</div>

<script>
let currentPage = 1;
let currentQuery = '';
let currentSort = 'latest';
let allFetchedScripts = [];
let searchTimeout = null;

// Заглушка для битых картинок
function handleImageError(img) {
    img.onerror = null;
    img.src = '/images/solara.webp';
}

// Форматирование просмотров
function formatViews(views) {
    const num = Number(views) || 0;
    if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
    if (num >= 1000) return (num / 1000).toFixed(1) + 'k';
    return num.toString();
}

// Управление выпадающим меню с анимацией
function toggleSortDropdown() {
    const menu = document.getElementById('sort-dropdown-menu');
    const arrow = document.getElementById('sort-arrow');
    const isOpen = menu.classList.contains('is-open');
    
    if (isOpen) {
        closeSortDropdown();
    } else {
        menu.classList.add('is-open');
        if (arrow) arrow.style.transform = 'rotate(180deg)';
    }
}

function closeSortDropdown() {
    const menu = document.getElementById('sort-dropdown-menu');
    const arrow = document.getElementById('sort-arrow');
    if (menu) menu.classList.remove('is-open');
    if (arrow) arrow.style.transform = 'rotate(0deg)';
}

function selectSort(val, label) {
    currentSort = val;
    
    // Показываем чистое имя (без "Sort:")
    document.getElementById('current-sort-label').innerText = label;
    
    // Подсветка активной опции
    const options = document.querySelectorAll('.sort-option');
    options.forEach(opt => {
        const isMatch = opt.getAttribute('onclick').includes(`'${val}'`);
        const check = opt.querySelector('.check-mark');
        if (isMatch) {
            opt.classList.add('active-option');
            if (check) check.classList.remove('hidden');
        } else {
            opt.classList.remove('active-option');
            if (check) check.classList.add('hidden');
        }
    });

    closeSortDropdown();
    renderScripts();
}

document.addEventListener('click', (e) => {
    const dropdown = document.getElementById('custom-sort-dropdown');
    if (dropdown && !dropdown.contains(e.target)) {
        closeSortDropdown();
    }
});

// Индивидуальные описания для скриптов
function getScriptDescription(item) {
    if (item.features && typeof item.features === 'string' && item.features.trim().length > 3) {
        return item.features.trim();
    }
    if (Array.isArray(item.features) && item.features.length > 0) {
        return item.features.join(', ');
    }
    if (item.description && typeof item.description === 'string' && item.description.trim().length > 3) {
        return item.description.trim();
    }

    const rawTitle = item.title || 'Roblox Script';
    const gameName = item.game?.name || 'Roblox';
    const cleanTitle = rawTitle.replace(/\[.*?\]/g, '').replace(/\|/g, '').trim();

    if (item.key === false) {
        return `Free keyless script for ${gameName}. Features ${cleanTitle || 'custom GUI'} with fast execution and instant access.`;
    }
    
    return `${cleanTitle || 'Script Hub'} designed for ${gameName}. Updated script features and player enhancements for execution.`;
}

// Отрисовка карточек
function renderScripts() {
    const container = document.getElementById('scripts-container');
    container.innerHTML = '';

    if (allFetchedScripts.length === 0) {
        container.innerHTML = '<p class="text-center text-gray-500 col-span-3 py-16">No scripts found.</p>';
        return;
    }

    let displayScripts = [...allFetchedScripts];

    if (currentSort === 'views-desc') {
        displayScripts.sort((a, b) => (Number(b.views) || 0) - (Number(a.views) || 0));
    } else if (currentSort === 'views-asc') {
        displayScripts.sort((a, b) => (Number(a.views) || 0) - (Number(b.views) || 0));
    }

    displayScripts.forEach(item => {
        let imageUrl = '/images/solara.webp';
        if (item.game && item.game.imageUrl) {
            imageUrl = item.game.imageUrl.startsWith('http') 
                ? item.game.imageUrl 
                : 'https://scriptblox.com' + item.game.imageUrl;
        }

        const isKeyless = item.key === false;
        const keyBadge = isKeyless 
            ? `<span class="text-[10px] text-green-400 font-bold bg-green-500/10 px-2 py-0.5 rounded-md border border-green-500/20 shrink-0">KEYLESS</span>`
            : `<span class="text-[10px] text-yellow-400 font-bold bg-yellow-500/10 px-2 py-0.5 rounded-md border border-yellow-500/20 shrink-0">KEY SYSTEM</span>`;

        const verifiedBadge = item.verified 
            ? `<span class="text-[10px] text-blue-400 font-bold bg-blue-500/10 px-2 py-0.5 rounded-md border border-blue-500/20 shrink-0">VERIFIED</span>` 
            : '';

        const gameName = item.game?.name || 'Roblox Game';
        const scriptTitle = item.title || 'Untitled Script';
        const viewsCount = formatViews(item.views);
        const scriptDesc = getScriptDescription(item);

        const card = document.createElement('div');
        card.className = 'glass-card flex flex-col justify-between h-full';
        
        card.innerHTML = `
            <div style="min-width: 0; width: 100%;">
                <div style="display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px; width: 100%;">
                    <div class="card-thumb-wrapper">
                        <img src="${imageUrl}" onerror="handleImageError(this)" alt="Game Thumbnail">
                    </div>

                    <div style="flex: 1; min-width: 0; overflow: hidden;">
                        <h3 style="font-size: 0.875rem; font-weight: 700; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 0;" title="${scriptTitle}">
                            ${scriptTitle}
                        </h3>
                        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 6px;">
                            <span style="font-size: 10px; color: #9ca3af; font-weight: 600; background: rgba(255,255,255,0.04); padding: 2px 6px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.08); white-space: nowrap; max-width: 110px; overflow: hidden; text-overflow: ellipsis;">
                                ${gameName}
                            </span>
                            ${keyBadge}
                            ${verifiedBadge}
                        </div>
                    </div>
                </div>

                <p style="font-size: 0.75rem; color: rgba(156, 163, 175, 0.9); line-height: 1.5; margin-bottom: 20px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word;">
                    ${scriptDesc}
                </p>
            </div>
            
            <div style="margin-top: auto; width: 100%;">
                <div style="display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #6b7280; margin-bottom: 10px; padding: 0 4px;">
                    <span style="display: flex; align-items: center; gap: 6px;"><span style="color: #9ca3af;">👁</span> ${viewsCount} views</span>
                    <span style="color: #60a5fa; font-weight: 700; letter-spacing: 0.05em; font-size: 10px; text-transform: uppercase;">RBXHub</span>
                </div>
                <button onclick="copyToClipboard(this, \`${encodeURIComponent(item.script || '')}\`)" class="btn-copy">
                    Copy Script
                </button>
            </div>
        `;
        container.appendChild(card);
    });
}

// Загрузка с API
async function fetchScripts(query = '', page = 1, append = false) {
    const container = document.getElementById('scripts-container');
    const loadMoreBtn = document.getElementById('load-more-btn');

    if (!append) {
        allFetchedScripts = [];
        container.innerHTML = '<p class="col-span-3 text-center py-16 text-gray-500 animate-pulse">Loading scripts...</p>';
    }

    let url = `https://scriptblox.com/api/script/fetch?page=${page}`;
    if (query.trim() !== '') {
        url = `https://scriptblox.com/api/script/search?q=${encodeURIComponent(query)}&page=${page}`;
    }

    try {
        const response = await fetch(url);
        const data = await response.json();
        
        const scripts = data.result?.scripts || data.result?.matchedScripts || [];

        if (append) {
            allFetchedScripts = [...allFetchedScripts, ...scripts];
        } else {
            allFetchedScripts = scripts;
        }

        renderScripts();

        if (scripts.length >= 20) {
            loadMoreBtn.style.display = 'inline-block';
            loadMoreBtn.innerText = 'Load More Scripts';
        } else {
            loadMoreBtn.style.display = 'none';
        }

    } catch (error) {
        console.error('Error:', error);
        if (!append) {
            container.innerHTML = '<p class="text-center text-red-500 col-span-3 py-16">Failed to load scripts.</p>';
        }
    }
}

// Копирование в буфер
function copyToClipboard(btnElement, encodedScript) {
    const scriptText = decodeURIComponent(encodedScript);
    navigator.clipboard.writeText(scriptText).then(() => {
        const originalText = btnElement.innerText;
        btnElement.innerText = '✓ COPIED TO CLIPBOARD';
        btnElement.classList.add('copied');

        setTimeout(() => {
            btnElement.innerText = originalText;
            btnElement.classList.remove('copied');
        }, 2000);
    }).catch(err => {
        console.error('Copy failed:', err);
    });
}

// Загрузить еще
function loadMoreScripts() {
    const loadMoreBtn = document.getElementById('load-more-btn');
    loadMoreBtn.innerText = 'Loading...';
    currentPage++;
    fetchScripts(currentQuery, currentPage, true);
}

// Поиск с debounce
document.getElementById('search-input').addEventListener('input', (e) => {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => {
        currentQuery = e.target.value;
        currentPage = 1;
        fetchScripts(currentQuery, currentPage, false);
    }, 400);
});

// Старт
fetchScripts();
</script>

</body>
</html>
