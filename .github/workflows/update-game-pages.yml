name: Update game script pages

on:
  schedule:
    - cron: '0 6 * * *' # каждый день в 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-game-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build pages
        run: node tools/build-game-pages.mjs
        env:
          # Необязательно: вебхук Discord-канала для постов о новых скриптах
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games pt es sitemap.xml
          if git diff --cached --quiet; then
            echo "Nothing changed"
          else
            git commit -m "Daily update of game script pages"
            git push
          fi
